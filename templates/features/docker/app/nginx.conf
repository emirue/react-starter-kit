server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers. nginx drops server-level add_header in any location that
  # sets its own, so locations below repeat them.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Liveness endpoint for HEALTHCHECK and orchestrators.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Vite fingerprints these files: cache them for a year. No "always":
  # a 404 for a missing asset must not be cached.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # Always revalidate the entry point so deployments take effect.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }
  # @if msw

  # The mock service worker is for development only.
  location = /mockServiceWorker.js {
    return 404;
  }
  # @endif

  # SPA fallback: client-side routes (and the app's own 404 page) load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
