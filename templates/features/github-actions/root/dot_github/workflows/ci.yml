name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # @if pm-pnpm
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # @endif
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # @if pm-pnpm
          cache: pnpm
          # @else
          cache: npm
          # @endif
      # @if pm-pnpm
      - run: pnpm install --frozen-lockfile
      # @else
      - run: npm ci
      # @endif
      - run: {{pmRun}} typecheck
      # @if eslint
      - run: {{pmRun}} lint
      # @endif
      # @if prettier && standalone
      - run: {{pmRun}} format:check
      # @endif
      # @if vitest && standalone
      - run: {{pmRun}} test:run
      # @endif
      # @if vitest && workspace
      - run: {{pmRun}} test
      # @endif
      - run: {{pmRun}} build
      # @if playwright
      - run: {{pmExec}} playwright install --with-deps chromium
        working-directory: {{appDir}}
      - run: {{pmRun}} test:e2e
        working-directory: {{appDir}}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: {{appDir}}/playwright-report/
          retention-days: 14
      # @endif
      # @if storybook && !playwright
      - run: {{pmExec}} playwright install --with-deps chromium
        working-directory: {{appDir}}
      # @endif
      # @if storybook
      - run: {{pmRun}} test:storybook
        working-directory: {{appDir}}
      - run: {{pmRun}} build-storybook
        working-directory: {{appDir}}
      # @endif
      # @if pm-pnpm
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      # @else
      - name: Audit dependencies
        run: npm audit --audit-level=high
      # @endif
