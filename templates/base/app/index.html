<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{appName}}</title>
    <!-- @if theme -->
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      try {
        const saved = localStorage.getItem("{{appName}}:theme")
        const dark =
          saved === "dark" ||
          (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      } catch {
        // Storage can be unavailable (privacy mode); the provider retries later.
      }
    </script>
    <!-- @endif -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
